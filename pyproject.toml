[project]
name = "agent-pipeline"
version = "0.1.0"
description = "硬件产品开发多 Agent 协作框架"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.100.0",
    "click>=8.1",
    "lark-oapi>=1.6.3",
    "markdown>=3.7",
    "openai>=1.0",
    "pydantic>=2.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "rich>=15.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
pipeline = "cli.__init__:cli"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["core*", "cli*", "feishu*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
